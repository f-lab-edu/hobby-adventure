spring:
  application:
    name: hobby-adventure
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 105MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.jian.hobbyadventure
  configuration:
    map-underscore-to-camel-case: true

server:
   port: 8080

management:
  endpoints:
    web:
      exposure:
        include: prometheus
